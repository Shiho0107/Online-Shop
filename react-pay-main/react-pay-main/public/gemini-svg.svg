<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E8E93;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFE39F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC9966;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#appleGradient)" />
    
    <path d="M 18 60 L 18 25 L 32 45 L 40 35 L 48 45 L 62 25 L 62 60" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <circle cx="28" cy="52" r="4" fill="#FFE39F" opacity="0.9"/>
    <circle cx="40" cy="22" r="4" fill="#FFE39F" opacity="0.9"/>
    <circle cx="52" cy="52" r="4" fill="#FFE39F" opacity="0.9"/>
  </g>

  <text x="110" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="800" 
        fill="#1D1D1F" 
        letter-spacing="1">MY</text>

  <text x="175" y="58" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="400" 
        fill="url(#goldGradient)" 
        letter-spacing="0.5">Web</text>

  <text x="112" y="76" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="600" 
        fill="#8E8E93" 
        letter-spacing="5">APPLE SPECIALIST</text>
</svg>
